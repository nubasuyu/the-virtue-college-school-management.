<!DOCTYPE html>
<html>
<head>
    <title>Upload Test</title>
</head>
<body>
    <h2>Virtue College File Upload Test</h2>
    <form action="http://localhost:3001/upload/file" method="post" enctype="multipart/form-data">

    </form>
</body>
</html>
